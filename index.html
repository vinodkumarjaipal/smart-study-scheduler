<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | Smart Study Scheduler</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="dashboard-container glass-effect">
        <header class="header">
            <div class="header-titles">
                <h1>Smart Study Scheduler</h1>
                <p class="subtitle">Dynamic Programming Engine</p>
            </div>
            <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </header>

        <section class="input-section">
            <h3 class="section-title">Add Study Session</h3>
            <form id="sessionForm">
                <div class="input-grid">
                    <div class="form-group">
                        <label for="subjectName">Subject Name</label>
                        <input type="text" id="subjectName" placeholder="e.g., Data Structures" required
                            autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority Weight</label>
                        <input type="number" id="priority" placeholder="10 = Highest (1-10)" min="1" max="10" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">+ Add to Study Pool</button>
            </form>
        </section>

        <hr class="divider">

        <main class="tables-wrapper">
            <section class="table-container draft-section">
                <div class="table-header">
                    <h3>Your Sessions (Draft Pool)</h3>
                    <button id="optimizeBtn" class="btn btn-primary btn-glow">Generate Optimal Plan</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Priority</th>
                            </tr>
                        </thead>
                        <tbody id="draftTableBody">
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="table-container optimal-section" id="optimalSection" style="display: none;">
                <h3 class="success-title">Final Optimal Study Plan</h3>
                <div class="table-responsive">
                    <table class="optimal-table">
                        <thead>
                            <tr>
                                <th>Selected Subject</th>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Weight</th>
                            </tr>
                        </thead>
                        <tbody id="optimalTableBody">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

</body>

</html>
